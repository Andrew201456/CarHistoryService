name: Planner secure account provisioning
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/planner-secure-provision.yml']
permissions: {}
concurrency:
  group: planner-secure-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Clean up temporary provisioning namespace
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,re,json,urllib.request,urllib.error
          token=os.environ["CF_TOKEN"]
          account=os.environ["CF_ACCOUNT"]
          if not token or not re.fullmatch(r"[a-fA-F0-9]{32}",account):
              raise SystemExit("Missing credentials")
          root="https://api.cloudflare.com/client/v4/accounts/"+account
          path="/storage/kv/namespaces/825626c7c857413c81d24fdaa23bb118"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          def api(method):
              req=urllib.request.Request(root+path,method=method,headers={"Authorization":"Bearer "+token})
              with opener.open(req,timeout=20) as res: result=json.loads(res.read())
              if not result.get("success"):raise RuntimeError("API rejected cleanup")
              return result.get("result")
          try:
              meta=api("GET")
          except urllib.error.HTTPError as e:
              if e.code==404:
                  print("Temporary namespace already absent")
                  raise SystemExit(0)
              raise SystemExit("Cleanup check HTTP "+str(e.code))
          if meta.get("title")!="planner-provision-marmich-27nov26":
              raise SystemExit("Unexpected namespace; nothing deleted")
          api("DELETE")
          print("Temporary provisioning namespace deleted.")
          PY
